name: EUR/USD pipeline

on:
  schedule:
    - cron: "0 6 5 * *"   # 06:00 UTC on the 5th of every month (after ECB publishes last month's average)
  workflow_dispatch:       # adds a "Run workflow" button on GitHub for manual runs

permissions:
  contents: write          # lets the job push the new data back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest from ECB API
        run: python ingest.py

      - name: Transform
        run: python transform.py

      - name: Commit updated data (only if something changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data this run - nothing to commit."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
